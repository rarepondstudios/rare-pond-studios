media:
  input: media
  output: /media
  extensions: [png, jpg, jpeg, webp, gif, svg, mp4]

content:
  - name: site
    label: Site Settings
    type: file
    path: data/site.json
    fields:
      - name: navBlurb
        label: "🏷️ Header hover blurb (what Studio is)"
        type: string
        description: "The one-line description that pops up under the STUDIO button when someone hovers it in the header of the other two sites. Keep it to 2-3 words (currently 'Narrative Films')."
      - name: imageSpecs
        label: "📐 READ ME - image specs for every upload on this site"
        type: text
        readonly: true
        description: "COLOR (applies to EVERY image): export sRGB, 8-bit. Do NOT export Display P3 or Adobe RGB - browsers will render them wrong (usually oversaturated). If you are exporting a frame from a video: video is Rec.709 and usually LIMITED range (16-235); it must be converted to sRGB FULL range (0-255), or blacks look milky and washed out. || SIZES: Film stills 2560x1440 (16:9). Page/feature backgrounds 2560x1440. Project bubbles 1200x1200 square. Team photos 800x800 square. Logos: transparent PNG, 1400 px+. Header duck mark 512x512 PNG. || FORMAT: photos = JPG or WebP (WebP preferred, ~30% smaller). Anything needing transparency = PNG. Keep every file under 600 KB. || NEVER UPSCALE a small image to hit these numbers - it just adds blur and weight. Better a sharp 1600 px file than a soft fake 2560. || Full detail + the stills pipeline: see STILLS.md and README.md in the repo."
      - name: projectsPublicAccess
        label: "🚧 Projects page is OPEN to the public"
        type: boolean
        default: true
        description: "ON (normal): visitors see the Projects page as usual. OFF: the page is closed - anyone who goes to rarepond.com/projects gets the 'back soon' cover instead (a random message from MAINTENANCE COVER), while the address, header and menus keep working so no links break and nobody is stranded. Everything returns the moment you switch it back on. Takes effect within about a minute of saving. (This switch used to live under Projects; it moved here because the project list itself is now managed in NocoDB.)"
      - name: home
        label: Home / Projects background
        type: object
        fields:
          - name: bgBubbleCount
            label: "🫧 Background bubble count"
            type: number
            default: 28
            description: "How many ambient floating bubbles drift behind the home and Projects backgrounds. Default 28. RECOMMENDED MAXIMUM ~40 - these bubbles are animated and GPU-composited, so higher counts can hurt rendering performance on weaker phones and laptops. It is CRITICAL the site stays smooth on ALL devices, so raise this gently and only if it still feels light on a mid-range phone. Leave blank to use the default. (Hard-capped at 60 in code as a safety net.) Takes effect on the next page load after saving."
      - name: veil
        label: "✨ Page-load fade"
        type: object
        description: "The brand-colour cover that fades the site in on load (and masks images/video popping in). Pick which COLOUR LOOK drives its gradient, or turn it off."
        fields:
          - { name: colorLook, label: "Colour look (type a look's name or key)", type: string, description: "Which colour look colours the fade. Type a look's NAME or key exactly as it appears in the Color Looks list (e.g. \"signature\", \"Geri-Action\", \"invalid\", \"violet\"). Its colours are muted onto a dark base for a subtle gradient. Leave BLANK for the site's plain dark background. Colour looks are shared + edited in NocoDB." }
          - { name: style, label: "Fade colour style", type: select, default: full, options: { values: [muted, full] }, description: "FULL shows the look's colours vividly (matches the Rare Pond transport splash). MUTED tones them onto a dark base for a subtler cover." }
          - { name: enabled, label: "Fade enabled", type: boolean, default: true, description: "ON: the branded fade-in plays on load. OFF: the page appears immediately with no cover." }

      - name: cursor
        label: "🖱 Custom cursor (per sub-site)"
        type: object
        description: "The soft gradient circle + dot that replaces the mouse on desktop (auto-hidden on touch devices). Per sub-site: turn it on/off and pick which COLOUR LOOK tints it (blank/'signature' = the site look). It morphs onto buttons on hover and shows a white loading orbit during long transitions."
        fields:
          - name: studio
            label: "Studio site"
            type: object
            fields:
              - { name: enabled, label: "Cursor enabled", type: boolean, default: true, description: "ON: the custom cursor replaces the mouse on the studio site (desktop only)." }
              - { name: colorLook, label: "Colour look (key or name)", type: string, description: "Which colour look tints the cursor. Type a look's key or NAME exactly as in the Color Looks list. Blank = signature." }
          - name: rentals
            label: "Rentals site"
            type: object
            fields:
              - { name: enabled, label: "Cursor enabled", type: boolean, default: true, description: "ON: the custom cursor replaces the mouse on the rentals site (desktop only)." }
              - { name: colorLook, label: "Colour look (key or name)", type: string, description: "Which colour look tints the cursor. Blank = signature." }
          - name: media
            label: "Media site"
            type: object
            fields:
              - { name: enabled, label: "Cursor enabled", type: boolean, default: true, description: "ON: the custom cursor replaces the mouse on the media site (desktop only)." }
              - { name: colorLook, label: "Colour look (key or name)", type: string, description: "Which colour look tints the cursor. Blank = signature." }

      - name: logos
        label: Logos
        type: object
        fields:
          - { name: color, label: Full-color logo (About section), type: image, description: "SPECS: transparent PNG, 1400 px wide or more, under 400 KB. COLOR: export sRGB, 8-bit (not Display P3 / Adobe RGB, or it shifts in browsers)." }
          - { name: footer, label: Footer logo (filled duck + palette), type: image, description: "SPECS: transparent PNG, 1400 px wide or more, under 400 KB. Sits on a dark footer, so it must read light. COLOR: export sRGB, 8-bit (not Display P3 / Adobe RGB, or it shifts in browsers)." }
          - { name: duckMark, label: Duck mark (header icon), type: image, description: "SPECS: transparent PNG, square, 512x512 px, under 150 KB. Shown tiny (about 44 px) - keep it bold and simple. COLOR: export sRGB, 8-bit (not Display P3 / Adobe RGB, or it shifts in browsers)." }
      - { name: water, label: Water / caustics background, type: image, description: "SPECS: JPG or WebP, 2560x1440 px, under 500 KB. Tiles behind the footer/hero - mid-to-dark works best. COLOR: export sRGB, 8-bit (not Display P3 / Adobe RGB, or it shifts in browsers)." }
      - name: hero
        label: Hero
        type: object
        fields:
          - { name: title, label: Headline, type: string }
          - { name: titleEm, label: Headline accent, type: string }
          - { name: subtitle, label: Subtitle, type: text }
      - name: about
        label: About blurb
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: paragraphs, label: Paragraphs, type: text, list: true }
          - { name: button, label: Button text, type: string }
      # Social links moved to NocoDB (the `socials` table) 2026-08-04 - edit accounts, links,
      # bubble blurbs and colours there; socials_sync.py writes data/socials.json for BOTH sites.
      # (No longer edited here or in site.json.)
      - { name: orbits, label: "About-logo floating images (paste /media/... paths)", type: string, list: true, description: "The little film-still bubbles that orbit the logo. Each entry is a PATH into the shared media library. Paste the generated file path straight from the stills or BTS attribute in NocoDB (e.g. /media/projects/geriaction/stills/ga-1-800.webp). The bubble then shows the SAME file the project already uses, no re-upload, no duplicate copies. A full https:// URL or a path without the leading slash also works. They are masked into circles, so pick stills with a centred subject." }
      - name: header
        label: Header (shared - studio + rentals)
        type: object
        fields:
          - { name: brandLine1, label: Brand - line 1, type: string }
          - { name: brandLine2, label: Brand - line 2 (studio), type: string }
      - name: nav
        label: Navigation (shared - drives header + footer on ALL sites)
        description: "The single list of page links. Header shows the items marked 'Show in header' (Our Team / Projects / Contact); every footer shows the whole list. Edit a label here once and it updates the header and footer on the studio, media and rentals sites together."
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: go, label: In-site target (home/team/projects/contact - blank if it's a link to another site), type: string }
          - { name: href, label: "Site/URL link (e.g. / , /media , /rentals) - blank if in-site", type: string }
          - { name: header, label: Show in header nav, type: boolean }
      - name: sectionHeadings
        label: Section headings (studio)
        type: object
        fields:
          - { name: projectsEyebrow, label: Projects - eyebrow, type: string }
          - { name: projectsHeading, label: Projects - heading, type: string }
          - { name: projectsSub, label: Projects - subtitle, type: text }
          - { name: teamEyebrow, label: Team - eyebrow, type: string }
          - { name: teamHeading, label: Team - heading, type: string }
          - { name: teamSub, label: Team - subtitle, type: text }
          - { name: contactEyebrow, label: Contact - eyebrow, type: string }
          - { name: contactHeading, label: Contact - heading, type: string }
          - { name: contactSub, label: Contact - subtitle, type: text }
      - name: teamCrew
        label: Team page - crew blurb (studio)
        type: object
        fields:
          - { name: blurb, label: Crew blurb, type: text }
          - { name: button, label: Button label, type: string }
      - name: footer
        label: Footer (shared - studio + rentals)
        type: object
        fields:
          - { name: tagline, label: Tagline, type: string }
          - { name: copyrightUrl, label: Copyright link URL, type: string }
          - { name: copyrightUrlText, label: Copyright link text, type: string }
          - { name: copyright, label: Copyright line, type: string }
          # Footer links are now the shared "Navigation" list above (site.json → nav),
          # the same list that drives the header. Edit page links there, once, for all sites.
      - name: hubspot
        label: Contact form (HubSpot)
        type: object
        fields:
          - { name: portalId, label: Portal ID, type: string }
          - { name: region, label: Region, type: string }
          - { name: formId, label: Form ID, type: string }
      - name: eventBanner
        label: Event banner (all sites - studio + rentals + media)
        type: object
        fields:
          - { name: enabled, label: Show the event banner, type: boolean }
          - { name: title, label: Banner title text, type: string }
          - { name: buttonText, label: Button text, type: string }
          - { name: buttonLink, label: "Button link (URL or /path)", type: string }
          - { name: colorLook, label: "Linked color look", type: string,
              description: "The name (ID) of a look in COLOR LOOKS. That look's colors are applied here. Type it exactly as the look's ID (e.g. signature, rainbow, red, geri). If it does not match a real look, nothing is applied and the built-in colors are used - open the Color Looks preview page, it flags any broken link in red." }
          - { name: gradientStyle, label: "Gradient style - Stream (wide horizontal sweep, best for this banner) or Pinwheel (rotating conic, best for round bubbles)", type: select, options: { values: [stream, pinwheel] } }

  - name: mediasite
    label: "Media Sub Site"
    type: file
    path: data/media.json
    fields:
      - name: cmsNote
        label: "✏️ Rare Pond Media, the /media pitch site"
        type: string
        readonly: true
        description: "Everything on rarepond.com/media. Edit the text and swap the main images here. The cinematic showcase + on-set photos default to existing project stills/BTS, but you can replace any of them. Images you upload go to the shared media library and are referenced as /media/... . In each heading, the 'accent' field is the word shown in the signature gradient. It must appear (spelled + cased) exactly within that heading, or nothing is highlighted. Leaving a text box blank keeps the page's built-in default for that item. IMAGE SPECS: export sRGB, 8-bit (never Display P3 / Adobe RGB). Backgrounds + stills 2560x1440 (16:9); on-set photos 16:9 or 4:3; keep every file under 600 KB; never upscale."
      - name: navBlurb
        label: "🏷️ Header hover blurb (what Rare Pond Media is)"
        type: string
        description: "The one-line description that pops up under the MEDIA button when someone hovers it in the header of the other two sites. Keep it to 2-3 words (currently 'Business Videography')."
      - name: seo
        label: Search / browser tab
        type: object
        fields:
          - { name: title, label: Browser tab title, type: string }
          - { name: description, label: Search-result description, type: text }
      - name: hero
        label: Hero (top of page)
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow (small label above the headline), type: string }
          - { name: headline, label: Headline, type: string }
          - { name: accent, label: "Headline: gradient-highlighted word (must appear in the headline)", type: string }
          - { name: subtitle, label: Subtitle, type: text }
          - { name: image, label: "Hero background image (image path, paste from NocoDB or pick an existing /media file)", type: string, description: "A /media/... path into the shared media library. You can also PASTE a /media/... path here straight from the stills/BTS attribute in NocoDB. The page then uses the SAME file the project already uses (no re-upload, no duplicate copies). SPECS if adding something new: 2560x1440 (16:9), JPG/WebP, sRGB 8-bit, under 600 KB. Darker reads best. The white headline sits on top of it." }
      - name: statement
        label: Statement (big centered line)
        type: object
        fields:
          - { name: kicker, label: Kicker (small label above), type: string }
          - { name: heading, label: Heading, type: string }
          - { name: accent, label: "Heading: gradient-highlighted word", type: string }
          - { name: body, label: Body, type: text }
      - name: showcase
        label: Cinematic showcase (grid of stills)
        type: object
        list: true
        description: "The five cinematic stills under the statement (2 large + 3 smaller). Replace any of them, and reorder by reordering this list. The five slots on the page fill in this order. Defaults to existing film stills. (Adding a sixth or removing one is a quick code tweak, ask to wire it up.)"
        fields:
          - { name: image, label: "Still (image path, paste from NocoDB)", type: string, description: "A /media/... path into the shared media library. You can also PASTE a /media/... path here straight from the stills/BTS attribute in NocoDB. The page then uses the SAME file the project already uses (no re-upload, no duplicate copies). SPECS if adding something new: 16:9, JPG/WebP, sRGB 8-bit, under 600 KB." }
          - { name: alt, label: Alt text (describes the image for accessibility), type: string }
      - name: sections
        label: Story sections (image + text)
        type: object
        list: true
        description: "The three alternating image/text blocks ('Why us / Collaboration / We're Human'). Edit any of them, and reorder by reordering this list. The three slots fill in this order and alternate image-side automatically. (Adding a fourth or removing one is a quick code tweak, ask to wire it up.)"
        fields:
          - { name: badge, label: Badge (small pill label), type: string }
          - { name: heading, label: Heading, type: string }
          - { name: accent, label: "Heading: gradient-highlighted word", type: string }
          - { name: body, label: Body, type: text }
          - { name: image, label: "Photo (image path, paste from NocoDB)", type: string, description: "A /media/... path into the shared media library. On-set / BTS photos read best here. You can also PASTE a /media/... path here straight from the stills/BTS attribute in NocoDB. The page then uses the SAME file the project already uses (no re-upload, no duplicate copies). SPECS if adding something new: 4:3 or 16:9, JPG/WebP, sRGB 8-bit, under 600 KB." }
      - name: cta
        label: Call to action (bottom)
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: accent, label: "Heading: gradient-highlighted word", type: string }
          - { name: body, label: Body, type: text }
          - { name: buttonLabel, label: Button label, type: string }
          - { name: buttonHref, label: "Button link (e.g. /#contact, a /path, or a full https:// URL)", type: string }
          - { name: image, label: "Background image (image path, paste from NocoDB)", type: string, description: "A /media/... path into the shared media library. You can also PASTE a /media/... path here straight from the stills/BTS attribute in NocoDB. The page then uses the SAME file the project already uses (no re-upload, no duplicate copies). SPECS if adding something new: 2560x1440 (16:9), JPG/WebP, sRGB 8-bit, under 600 KB. Darker reads best." }

  - name: rentals
    label: "Rentals Sub Site"
    type: file
    path: data/rentals.json
    fields:
      - name: navBlurb
        label: "🏷️ Header hover blurb (what Rentals is)"
        type: string
        description: "The one-line description that pops up under the RENTALS button when someone hovers it in the header of the other two sites. Keep it to 2-3 words (currently 'Rent Our Gear')."
      - name: publicAccess
        label: "🚧 Rentals page is OPEN to the public"
        type: boolean
        default: true
        description: "ON (normal): visitors see the rentals page and can request a quote. OFF: the page is closed - anyone who goes to rarepond.com/rentals gets the 'back soon' cover instead, with a random message and picture from MAINTENANCE COVER below. The address stays the same, so links you have already shared are not broken and everything comes straight back the moment you switch this on again. The header and menus still work on the cover, so nobody is stranded. Takes effect within about a minute of committing."
      - { name: seoDescription, label: SEO description (search-result blurb), type: text }
      - { name: brandLine1, label: Header brand - line 1, type: string }
      - { name: brandLine2, label: Header brand - line 2 (rentals), type: string }
      - { name: cartEstimateNote, label: Cart estimate note, type: text }
      - name: categories
        label: Gear categories (names + colors)
        type: object
        list: true
        description: >-
          The gear categories shown across the rentals site. The ORDER here is the order
          of the tabs. Rename a category freely - that only changes what visitors see, not
          the rentals database. To recolor one, point it at a different color look.
        fields:
          - { name: id, label: "Category ID (from the rentals database - do NOT change)", type: string,
              description: "This is the exact category string on the gear in the rentals database. It is what groups the gear, so it must match the database EXACTLY. To actually rename a category in the database you have to change it in the database (NocoDB) as well as here. Changing this field alone will just stop the category working." }
          - { name: label, label: "Display name (what visitors see)", type: string,
              description: "Safe to change any time. This does not touch the database." }
          - { name: colorLook, label: "Linked color look", type: string,
              description: "The name (ID) of a look in COLOR LOOKS - e.g. red, amber, violet, yellow, green, or signature. That look's Color 1 becomes this category's color. If it does not match a real look, the category keeps its built-in color; the Color Looks preview page flags broken links in red." }
      - name: logos
        label: Rentals logos
        type: object
        fields:
          - { name: headerMark, label: Header duck mark, type: image, description: "SPECS: transparent PNG, square, 512x512 px, under 150 KB. COLOR: export sRGB, 8-bit (not Display P3 / Adobe RGB, or it shifts in browsers)." }
          - { name: footerColor, label: Footer full-color logo, type: image, description: "SPECS: transparent PNG, 1400 px wide or more, under 400 KB. Sits on dark - must read light. COLOR: export sRGB, 8-bit (not Display P3 / Adobe RGB, or it shifts in browsers)." }
          - { name: footerWater, label: Footer water / caustics background, type: image, description: "SPECS: JPG or WebP, 2560x1440 px, under 500 KB. COLOR: export sRGB, 8-bit (not Display P3 / Adobe RGB, or it shifts in browsers)." }
          - { name: homeLogo, label: Home hero logo, type: image, description: "SPECS: transparent PNG, about 1600 px wide, under 500 KB. COLOR: export sRGB, 8-bit (not Display P3 / Adobe RGB, or it shifts in browsers)." }
      - name: home
        label: Home hero copy
        type: object
        fields:
          - { name: heroTitle, label: Hero title, type: string }
          - { name: heroSubtitle, label: Hero subtitle, type: text }
          - { name: datePrompt, label: Date button prompt (no dates yet), type: string }
          - { name: browseButton, label: Browse-gear button, type: string }
      - name: crew
        label: Crew-your-shoot blurb
        type: object
        fields:
          - { name: blurb, label: Crew blurb, type: text }
          - { name: button, label: Button label, type: string }
      - name: cart
        label: Cart UI labels
        type: object
        fields:
          - { name: title, label: Cart title, type: string }
          - { name: dailyTotal, label: Daily-total label, type: string }
          - { name: quoteButton, label: Request-quote button, type: string }
          - { name: emptyMessage, label: Empty-cart message (HTML allowed), type: text }

  - name: projects
    label: "Projects"
    type: file
    path: data/section-templates.json
    fields:
      - name: cmsNote
        label: "✏️ EDIT HERE: shared text templates for every film"
        type: string
        readonly: true
        description: "The four boxes below are the SHARED templates for the lines of text the site builds around every film. Write each one ONCE and it applies to EVERY project - the site fills in each film's own values (from NocoDB) wherever you put a {variable} in curly braces. Change the wording of the LINE here; change each film's actual CONTENT (kicker, tagline, logline, credits) in NocoDB. AVAILABLE VARIABLES: {title}, {year}, {production}, {status}, {released} (smart: year if set, otherwise status), {kicker}, {tagline}, {genre}, {logline}. Empty variables - and any separator left dangling next to them, like a stray ' · ' - are dropped automatically. TIP: see any template rendered live against a real film at rarepond.com/admin/preview before you save."
      - name: nocodbNote
        label: "📋 The project list itself is edited in NocoDB (read-only here)"
        type: string
        readonly: true
        description: "The films themselves - their names, images, which sites show each one, colour look, carousel and glow toggles, per-film text (kicker, tagline, logline, credits), and order - all live in the shared database and are edited in NocoDB at http://localhost:8080, where you can also see each project by name with its bubble thumbnail. A background sync rebuilds the site from there automatically, so there is nothing to edit for the list itself on this screen. To OPEN or CLOSE the whole Projects page to the public, use SITE SETTINGS → 'Projects page is OPEN to the public'. Colour palettes live in COLOR LOOKS. The boxes ABOVE are the only editable things here - they control the shared wording, not the individual films."

      - name: eyebrowTemplate
        label: "🏷️ Project page: eyebrow (top-right label)"
        type: string
        default: "{production}"
        description: "The small uppercase label at the top-right of each film's own page. It is the PRODUCTION COMPANY on its own, because the year is already shown elsewhere on both sites and repeating it read as clutter. A film with no production company set renders NO label at all rather than an empty line, so this is safe to leave unset. Other variables still work if you want them: '{production} · {released}' would show 'Rare Pond Studios · 2026' (or '· In Post-Production' when there is no year yet), and any variable that is empty, plus a separator left dangling beside it, is dropped automatically."
      - name: cardEyebrowTemplate
        label: "🏷️ Home featured card: small line above the title"
        type: string
        default: "{kicker}"
        description: "The little uppercase line on the FEATURED (center) card of the home carousel. Default '{kicker}' shows each film's kicker. EXAMPLE: '{production} · {released}' would show 'Rare Pond Studios · 2026'."
      - name: cardLoglineTemplate
        label: "🏷️ Home featured card: one-liner under the title"
        type: string
        default: "{logline}"
        description: "The sentence on the FEATURED (center) card of the home carousel. Default '{logline}' shows each film's logline. You can combine text and variables, e.g. '{genre} · {logline}'."
      - name: gridCaptionTemplate
        label: "🏷️ Projects grid: caption under each tile"
        type: string
        default: "{kicker}"
        description: "The small caption under each bubble in the Projects grid / carousel. Default '{kicker}' shows each film's kicker. EXAMPLE: '{genre} · {year}' would show 'Sci-Fi · 2026'."
  - name: team
    label: Team
    type: file
    path: data/team.json
    fields:
      - name: publicAccess
        label: "🚧 Our Team page is OPEN to the public"
        type: boolean
        default: true
        description: "ON (normal): visitors see the page as usual. OFF: the page is closed - anyone who goes to rarepond.com/team gets the 'back soon' cover instead, with a random message from MAINTENANCE COVER. The address stays the same, so links you have already shared are not broken and everything comes straight back the moment you switch this on again. The header and menus still work on the cover, so nobody is stranded. Takes effect within about a minute of committing."
      - name: team
        label: Team members
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: role, label: Role, type: string }
          - { name: photo, label: Photo, type: image, description: "SPECS: square, 800x800 px, JPG, under 250 KB. Cropped to a circle - centre the face. COLOR: export sRGB, 8-bit (not Display P3 / Adobe RGB, or it shifts in browsers)." }
          - { name: desc, label: Bio, type: text }
          # ---- Portfolio links (all optional). Any you leave blank is simply not shown, and the
          #      row closes the gap - so a person with only a website and Instagram shows exactly
          #      two icons, no empty spaces. Paste the FULL https:// address for each.
          - { name: website,   label: "Portfolio - Website (optional)",   type: string, description: "Full https:// link to this person's own site/portfolio. Blank = hidden." }
          - { name: youtube,   label: "Portfolio - YouTube (optional)",   type: string, description: "Full https:// link. Blank = hidden." }
          - { name: instagram, label: "Portfolio - Instagram (optional)", type: string, description: "Full https:// link. Blank = hidden." }
          - { name: linkedin,  label: "Portfolio - LinkedIn (optional)",  type: string, description: "Full https:// link. Blank = hidden." }
          - { name: facebook,  label: "Portfolio - Facebook (optional)",  type: string, description: "Full https:// link. Blank = hidden." }

  - name: pages
    label: Custom Pages
    type: file
    path: data/pages.json
    fields:
      - name: directoryUrl
        label: "▶ Page directory - every address on the site (open this URL in a new browser tab)"
        type: string
        readonly: true
        description: "The full list of every page on the site and the exact link to reach it - films, custom pages, rentals and the internal pages. It is generated from the live data, so a page you add below appears there by itself. Open it when you need a link to send someone, or to check that a new page is actually reachable."
      - name: directoryUser
        label: "🔒 Username for that page"
        type: string
        readonly: true
        description: "The page asks for a login. This is the username. Same login as the Color Looks page."
      - name: directoryPasswordLocation
        label: "🔑 Password - where to find it"
        type: string
        readonly: true
        description: "On Mac/iPhone/iPad, Safari will autofill the login box for you. Not written down here on purpose: this repo is PUBLIC, so anything typed into Pages CMS is visible to the world. Never put a password, key or token in this CMS."
      - name: pages
        label: Custom pages
        type: object
        list: true
        description: "Each entry is a whole page on the studio site. Click 'Add item' at the bottom to make a new one. The page lives at rarepond.com/SLUG (see 'URL slug' below)."
        fields:
          - name: slug
            label: URL slug (lowercase, no spaces - e.g. summer-open-house)
            type: string
            pattern: '^(?!(?:admin|assets|data|functions|geriaction|invalidopinion|media|projects|rentals|revelations|team|tools)$)[a-z0-9]+(?:-[a-z0-9]+)*$'
            description: "The page's web address. Slug 'summer-open-house' → rarepond.com/summer-open-house. Use lowercase letters, numbers and single dashes only. Certain words are refused because a film or a built-in page already answers to them (team, projects, rentals, admin, geriaction, revelations, invalidopinion) - if a page used one of those it could never open, so it is blocked here rather than failing silently later. This list is generated from the live films by tools/check-slugs.mjs; after adding or renaming a film, run `node tools/check-slugs.mjs --write` (the tests fail if you forget)."
          - name: publicAccess
            label: "🚧 This page is OPEN to the public"
            type: boolean
            default: true
            description: "ON (normal): visitors see the page. OFF: this one page is closed and shows the 'back soon' cover instead, with a random message from MAINTENANCE COVER. The address stays the same, so any link you have shared still works and the page comes straight back when you switch this on again. Each custom page has its own switch, so closing one does not touch the others."
          - name: title
            label: Page title (browser tab + nav fallback)
            type: string
          - name: navLabel
            label: Nav banner label (short - e.g. 'Open House')
            type: string
            description: "What the top-banner link says. Leave blank to use the Page title."
          - name: showInStudioNav
            label: Show in the STUDIO top banner
            type: boolean
            description: "OFF by default. Turn on when the page is ready to be public. The page still works at its URL when this is off - this only controls the banner link."
          - name: showInRentalsNav
            label: Show in the RENTALS top banner
            type: boolean
            description: "Adds a link in the rentals-site banner that jumps across to this page. Independent of the studio toggle."
          - name: navOrder
            label: Nav position (lower number = further left)
            type: number
            description: "Only matters if a nav toggle is on. Our Team/Projects/Contact sit at the start; custom pages are appended in this order."
          - name: background
            label: Page background
            type: select
            options: { values: [home, team, custom] }
            description: "home = the deep-water look from the front page (bubbles optional). team = the light blue 'Meet Rare Pond' look. custom = your own image (set below)."
          - name: bubbles
            label: Show floating bubbles (only applies when background = home)
            type: boolean
          - name: customBg
            label: "Custom background image (only when background = custom)"
            type: image
            description: "SPECS: 2560 x 1440 px or larger, JPG or WebP, under 600 KB. It is scaled to cover the page and centred, so keep anything important away from the outer 10% edges. A darker image reads best - page text is light on 'home', dark on 'team'/'custom'."
          - name: blocks
            label: "Page content blocks - DRAG TO REORDER. The page renders top-to-bottom in this exact order."
            type: object
            list: true
            description: "Add a block, pick its Type, then fill in ONLY the field that Type needs (the others are ignored). Types: image / header / subheader / body / button / form."
            fields:
              - name: type
                label: Block type
                type: select
                options: { values: [image, header, subheader, body, button, form] }
                description: "image → uses 'Image' + 'Image caption'. header/subheader/body → use 'Text'. button → uses the three Button fields. form → uses 'Jotform form ID'."
              - name: text
                label: "Text  (for: header / subheader / body)"
                type: text
                description: "Body text supports blank lines for paragraphs. Basic HTML links are allowed."
              - name: image
                label: "Image  (for: image blocks)"
                type: image
                description: "SPECS: up to 2000 px wide, JPG/PNG/WebP, under 500 KB. Displays full width of the content column with rounded corners."
              - name: caption
                label: "Image caption (optional, for: image blocks)"
                type: string
              - name: buttonLabel
                label: "Button label  (for: button blocks)"
                type: string
              - name: buttonTarget
                label: "Button goes to  (for: button blocks)"
                type: select
                options: { values: [home, team, projects, contact, rentals, page, url] }
                description: "Pick a place on this site. Choose 'page' to link to another custom page, or 'url' for an external link - then fill in the field below."
              - name: buttonUrl
                label: "Button - page slug or external URL"
                type: string
                description: "If 'Button goes to' = page → put the other page's slug here (e.g. summer-open-house). If = url → put the full https:// address."
              - name: jotformId
                label: "Jotform form ID  (for: form blocks)"
                type: string
                description: "Open your form in Jotform. The ID is the long number in the address bar - e.g. jotform.com/build/261817432074052 → paste 261817432074052. Swapping forms later = paste a different ID. Nothing else to do."
              - name: formHeight
                label: "Form height in pixels (optional - default 900)"
                type: number

  - name: contact
    label: "Contact Popup"
    type: file
    path: data/contact.json
    fields:
      - name: cmsNote
        label: "✉️ The Contact popup, shared by Studio, Rentals + Media"
        type: string
        readonly: true
        description: "The 'Get in touch' popup that opens from the Contact button in the header (and the Get in touch buttons on the home pages) on all three sites. It's the SAME form everywhere, edited here once. The social bubbles beside the form + their blurbs come from the socials table in NocoDB. Below you control the heading text and the HubSpot form it embeds."
      - { name: eyebrow, label: Eyebrow (small label above the heading), type: string }
      - { name: heading, label: Heading, type: string }
      - { name: sub, label: Sub-line under the heading, type: text }
      - { name: buttonLabel, label: "\"Get in touch\" button label", type: string }
      - name: hubspot
        label: HubSpot form
        type: object
        description: "The embedded HubSpot form. Find these in HubSpot → your form → Share → Embed (they're in the embed snippet)."
        fields:
          - { name: region, label: "Region (e.g. na2)", type: string }
          - { name: portalId, label: Portal ID, type: string }
          - { name: formId, label: Form ID, type: string }

  - name: formfields
    label: "Form Input Types"
    type: file
    path: data/form-fields.json
    fields:
      - name: rental
        label: Rental request form - input type per field
        type: object
        fields:
          - { name: firstName, label: First name, type: select, options: { values: [text, email, number, tel, url] } }
          - { name: lastName,  label: Last name,  type: select, options: { values: [text, email, number, tel, url] } }
          - { name: email,     label: Contact email, type: select, options: { values: [text, email, number, tel, url] } }
          - { name: film,      label: Film / project name, type: select, options: { values: [text, email, number, tel, url] } }
      - name: crew
        label: Crew-your-shoot form - input type per field
        type: object
        fields:
          - { name: first,   label: First name, type: select, options: { values: [text, email, number, tel, url] } }
          - { name: last,    label: Last name,  type: select, options: { values: [text, email, number, tel, url] } }
          - { name: email,   label: Contact email, type: select, options: { values: [text, email, number, tel, url] } }
          - { name: project, label: Project name, type: select, options: { values: [text, email, number, tel, url] } }
          - { name: budget,  label: Budget (number = digits only), type: select, options: { values: [text, email, number, tel, url] } }
          - { name: notes,   label: Notes, type: select, options: { values: [text, email, number, tel, url] } }

  - name: colorlooks
    label: Color Looks
    type: file
    path: data/colorlooks.json
    fields:
      - name: previewUrl
        label: "▶ Live color preview page (open this URL in a new browser tab)"
        type: string
        readonly: true
        description: "One page, two things. TOP: every colour look rendered EXACTLY as the two sites render it. A film look shows the full themed film-page treatment (accent, background washes, kicker, tagline, title); a basics/special look shows the bubble/banner glow it drives; a rentals category shows its one flat colour. BOTTOM (scroll down, or add #platform-colors): the read-only 'Platform colours' reference. The brand colour + real logo for every social platform (YouTube, Instagram, TikTok, X, Facebook, Threads, Vimeo, LinkedIn, IMDb) and every 'Watch on' streaming service (Prime Video, Netflix, Hulu, Disney+, Max, Apple TV+, Peacock, Paramount+, plus YouTube/Vimeo). Same login for both. This preview is VIEW-ONLY: colour looks are edited in NocoDB (the color_looks table), not here."
      - name: previewUser
        label: "🔒 Username for that page"
        type: string
        readonly: true
        description: "The page asks for a login. This is the username."
      - name: previewPasswordLocation
        label: "🔑 Password - where to find it"
        type: string
        readonly: true
        description: "On Mac/iPhone/iPad, Safari will autofill the login box for you. Not written down here on purpose: this repo is PUBLIC, so anything typed into Pages CMS is visible to the world. Never put a password, key or token in this CMS."
      - name: nocodbNote
        label: "🎨 Color looks are edited in NocoDB (this page is view-only + the live preview)"
        type: string
        readonly: true
        description: "Colour looks now live in the shared database: NocoDB → the color_looks table (http://localhost:8080). A background sync publishes data/colorlooks.json to BOTH sites automatically, so there is nothing to edit here. This screen only keeps the preview link + login above. To change a look's colours, edit its row in NocoDB (each field has a description), then reload the preview page to check it. (The per-look colour fields used to live here; they moved to NocoDB so the two sites and the preview can never drift, see D7 in the system plan.)"

  - name: maintenance
    label: Maintenance Cover
    type: file
    path: data/maintenance.json
    fields:
      - name: variations
        label: Messages shown when a page is closed
        type: object
        list: true
        description: >-
          When a page is switched off (Rentals page -> "Rentals page is OPEN to the public"),
          visitors get a "back soon" cover instead. ONE of the entries below is picked AT
          RANDOM each time the page is loaded, so someone who reloads sees a different message
          and a different picture. Add as many as you like - they are all equally likely, and
          nothing else needs changing. Every entry shows the Rare Pond duck, then your header
          and sub-header, and underneath that a line the site writes itself telling the visitor
          which page to come back to. An entry with no message is skipped, so a half-finished
          one can never be shown to a visitor.
        fields:
          - { name: header, label: Header (the big line), type: string,
              description: "Required. An entry with no header is never shown." }
          - { name: subHeader, label: Sub-header (the smaller line underneath), type: string }
          - { name: image, label: Picture, type: image,
              description: "The artwork shown above the message. All three are set to the Rare Pond duck for now. Drop in whatever you like later - it is shown WHOLE (never cropped) and capped so it can never push the message off the screen, so almost any shape works. SPECS: PNG or WebP, up to about 1200 px on the long edge, under 400 KB, transparent background looks best. If you leave it empty the entry still works; it just shows the message with no picture. COLOR: export sRGB, 8-bit." }

  - name: legal
    label: "Legal Terms + Privacy"
    type: file
    path: data/legal.json
    fields:
      - name: varsKey
        label: "🔑 READ ME - the variables you can type into any text box on this page"
        type: text
        readonly: true
        description: "Type a variable in square brackets anywhere in a heading or a text box below and the page fills in its value from SHARED VALUES. Change it in one place, every page changes. The ones that always exist: [businessName] [ownerName] [siteDomain] [contactEmail] [privacyEmail] [mailingStreet] [mailingCity] [mailingState] [mailingZip] [state] [county] [region]. TWO PAIRS ARE DELIBERATELY SEPARATE. The mailing address carries its own city, state and ZIP: those are where post is sent, while [state] and [county] are the law the site runs under and where a dispute would be heard, so moving the address never rewrites the Governing law section. And [privacyEmail] is used by the privacy policy while [contactEmail] is used by the terms page and anything general. Anything you add under YOUR OWN VARIABLES works the same way: name one bookingEmail and type [bookingEmail]. A variable you have not filled in yet shows on the page as an amber [... to be added] note instead of vanishing, so a blank can never read as a finished sentence. A word in brackets that is not one of your variables is left exactly as typed."

      - name: vars
        label: "① SHARED VALUES - the things that repeat, set once here"
        type: object
        description: "Every one of these can be typed into any heading or text box further down as [name], and the page fills in the value. This is why an email address or an address is never typed twice: change it here and both rarepond.com/terms and rarepond.com/privacy update together."
        fields:
          - { name: businessName, label: "Business name  →  [businessName]", type: string, description: "The legal name that appears in the body of both documents. Currently 'Rare Pond Studios'." }
          - { name: ownerName, label: "Owner name  →  [ownerName]", type: string, description: "The person behind the business, used where the documents say who operates the site." }
          - { name: siteDomain, label: "Site address  →  [siteDomain]", type: string, description: "The bare domain, no https:// and no trailing slash. Currently 'rarepond.com'." }
          - { name: contactEmail, label: "Contact email  →  [contactEmail]", type: string, description: "The address people are told to write to. Typed anywhere in a text box it becomes a working mail link by itself, so you never need to write out a link." }
          - { name: privacyEmail, label: "Privacy email  →  [privacyEmail]", type: string, description: "Where privacy requests go. The PRIVACY POLICY sends people here twice: in 'Reviewing, changing, or deleting your information' and in its contact block at the end. The TERMS page and anything general use [contactEmail] instead, because its closing block is ordinary business contact, not a privacy request. Do not leave this blank: the policy promises a reply within a reasonable time, so a blank shows an amber placeholder rather than quietly falling back to the contact address. If you do not want a separate inbox, put the contact address in here as well." }
          - { name: mailingStreet, label: "Mailing address, street  →  [mailingStreet]", type: string, description: "The street line only, e.g. '1234 Somewhere Ave, Suite 5'. THIS IS THE ONE STILL BLANK: until it is filled in, both pages show an amber '[street address to be added]' where it belongs." }
          - { name: mailingCity, label: "Mailing address, city  →  [mailingCity]", type: string, description: "The city post is sent to. Deliberately NOT the same field as the legal wording below: if the address ever moves, change it here and the Governing law section stays as it is." }
          - { name: mailingState, label: "Mailing address, state  →  [mailingState]", type: string, description: "The state post is sent to. Same reason as the city above: this is the postal address, not the law the site runs under." }
          - { name: mailingZip, label: "Mailing address, ZIP  →  [mailingZip]", type: string, description: "The postal code. It is rendered after the state with a space and no comma, the way an address is normally written: 'Burbank, California 91502'. Leave it blank and the page shows an amber '[ZIP code to be added]' chip, same as any other unfilled value. If a document should show no ZIP at all, delete [mailingZip] from that contact block rather than emptying this field." }
          - { name: state, label: "Legal state  →  [state]", type: string, description: "The state whose law governs the site. Drives the 'Governing law' section and the '[state] residents' heading in the privacy policy. Changing this changes which law the documents claim to run under, so it is not the field to touch when the office moves." }
          - { name: county, label: "County  →  [county]", type: string, description: "Used by the 'Governing law' section for where a dispute would be heard. Write it the way it reads in a sentence, e.g. 'Los Angeles County'." }
          - { name: region, label: "Region as it reads in a sentence  →  [region]", type: string, description: "The 'based in the ... area' phrase, e.g. 'Los Angeles / Burbank, California'." }
          - name: custom
            label: "🧩 YOUR OWN VARIABLES - add anything else that repeats"
            type: object
            list: true
            description: "Add a value here and it becomes usable as [name] in every text box on this page, exactly like the fixed ones above. Use it for anything that appears more than once and would be annoying to change in several places later: a booking email, a company number, an insurance requirement. Nothing else needs doing after you add one."
            fields:
              - { name: name, label: "Name (no spaces, e.g. bookingEmail)", type: string, pattern: '^[A-Za-z][A-Za-z0-9_-]*$', description: "Letters, numbers, dash and underscore only, starting with a letter. You then type it in brackets: bookingEmail becomes [bookingEmail]." }
              - { name: value, label: "Value (what it should say on the page)", type: string }

      - name: terms
        label: "② TERMS OF USE  (rarepond.com/terms)"
        type: object
        description: "The whole of rarepond.com/terms. Everything below is the page, in the order it appears. Saving publishes it within about a minute; there is no build step and nothing else to press."
        fields:
          - { name: title, label: "Page heading (the big line at the top)", type: string }
          - { name: effectiveDate, label: "Effective date", type: string, description: "Shown under the heading as 'Effective date: ...'. Change it whenever you make a real change to the wording, because the document itself promises a new date when it is updated. Write it the way you want it read, e.g. 'August 6, 2026'. Clear it to hide the line." }
          - { name: intro, label: "Opening paragraph (the lighter text under the date)", type: text, description: "The one-paragraph summary before the numbered sections start. Variables and basic formatting work here like anywhere else." }
          - { name: numberSections, label: "Number the sections automatically", type: boolean, default: true, description: "ON: sections are numbered 1, 2, 3 in the order they appear, and the numbers redo themselves whenever you drag, add or delete one. Leave this on. If you type your own numbers into the headings you will end up with '1. 1. Who we are' the first time you reorder." }
          - name: sections
            label: "SECTIONS - DRAG TO REORDER. The page reads top to bottom in this order."
            type: object
            list: true
            description: "Each entry is one numbered section of the document. A section with nothing in it is skipped rather than shown, so a half-written one can never appear on the live page. Deleting a section deletes that part of the document, so if you only want it out of the way for now, empty the heading and its blocks instead."
            fields:
              - { name: heading, label: "Section heading (no number, it is added for you)", type: string, description: "Type 'Who we are', not '1. Who we are'." }
              - name: blocks
                label: "What this section says - DRAG TO REORDER"
                type: object
                list: true
                description: "Add a block, pick its Type, then fill in ONLY the field that Type uses. The others are ignored, so a leftover value in the wrong field cannot show up on the page."
                fields:
                  - name: type
                    label: Block type
                    type: select
                    default: paragraph
                    options: { values: [paragraph, subheading, list, note, card, table] }
                    description: "paragraph = ordinary body text (leave a blank line between paragraphs to get more than one). subheading = a smaller heading inside the section, not numbered. list = bullet points. note = the highlighted callout box used for the 'a request is not a reservation' warning. card = a bordered box, used for the contact details at the end. table = the two-column 'who processes your information' table. paragraph / subheading / note / card use TEXT. list uses BULLET POINTS. table uses TABLE ROWS."
                  - { name: text, label: "Text  (paragraph / subheading / note / card)", type: text, description: "A blank line starts a new paragraph. You can use [variables], and basic formatting: <strong>bold</strong>, <em>italic</em>, <code>code</code>, <a href=\"/privacy/\">a link</a>, and <nobr>keep this on one line</nobr>. Anything else in angle brackets is shown as plain text rather than treated as formatting, so nothing you type here can break the page. Email addresses and https:// addresses turn into links on their own." }
                  - { name: items, label: "Bullet points  (list)", type: string, list: true, description: "One bullet per entry. Drag to reorder. Same variables and formatting as the text box above." }
                  - name: rows
                    label: "Table rows  (table)"
                    type: object
                    list: true
                    description: "Two columns. Drag to reorder."
                    fields:
                      - { name: label, label: "Left column (e.g. the company name)", type: string }
                      - { name: text, label: "Right column (what they do with your information)", type: text }
          - { name: browserTitle, label: "Browser tab title", type: string, description: "What shows in the browser tab and in a Google result. Variables work here too. Kept out of the way at the bottom because it rarely needs changing." }
          - { name: metaDescription, label: "Search-result description", type: text, description: "The grey line under the title in a search result. Aim for about 150 characters. Variables work here too." }

      - name: privacy
        label: "③ PRIVACY POLICY  (rarepond.com/privacy)"
        type: object
        description: "The whole of rarepond.com/privacy. Same idea as the Terms above. Remember that this document makes promises about what happens to people's information, so if the site starts using a new service, add it to the table in 'Third parties who process your information' as well as anywhere else it belongs."
        fields:
          - { name: title, label: "Page heading (the big line at the top)", type: string }
          - { name: effectiveDate, label: "Effective date", type: string, description: "Shown under the heading as 'Effective date: ...'. Change it whenever you make a real change to the wording, because the document itself promises a new date when it is updated. Write it the way you want it read, e.g. 'August 6, 2026'. Clear it to hide the line." }
          - { name: intro, label: "Opening paragraph (the lighter text under the date)", type: text, description: "The one-paragraph summary before the numbered sections start. Variables and basic formatting work here like anywhere else." }
          - { name: numberSections, label: "Number the sections automatically", type: boolean, default: true, description: "ON: sections are numbered 1, 2, 3 in the order they appear, and the numbers redo themselves whenever you drag, add or delete one. Leave this on. If you type your own numbers into the headings you will end up with '1. 1. Who we are' the first time you reorder." }
          - name: sections
            label: "SECTIONS - DRAG TO REORDER. The page reads top to bottom in this order."
            type: object
            list: true
            description: "Each entry is one numbered section of the document. A section with nothing in it is skipped rather than shown, so a half-written one can never appear on the live page. Deleting a section deletes that part of the document, so if you only want it out of the way for now, empty the heading and its blocks instead."
            fields:
              - { name: heading, label: "Section heading (no number, it is added for you)", type: string, description: "Type 'Who we are', not '1. Who we are'." }
              - name: blocks
                label: "What this section says - DRAG TO REORDER"
                type: object
                list: true
                description: "Add a block, pick its Type, then fill in ONLY the field that Type uses. The others are ignored, so a leftover value in the wrong field cannot show up on the page."
                fields:
                  - name: type
                    label: Block type
                    type: select
                    default: paragraph
                    options: { values: [paragraph, subheading, list, note, card, table] }
                    description: "paragraph = ordinary body text (leave a blank line between paragraphs to get more than one). subheading = a smaller heading inside the section, not numbered. list = bullet points. note = the highlighted callout box used for the 'a request is not a reservation' warning. card = a bordered box, used for the contact details at the end. table = the two-column 'who processes your information' table. paragraph / subheading / note / card use TEXT. list uses BULLET POINTS. table uses TABLE ROWS."
                  - { name: text, label: "Text  (paragraph / subheading / note / card)", type: text, description: "A blank line starts a new paragraph. You can use [variables], and basic formatting: <strong>bold</strong>, <em>italic</em>, <code>code</code>, <a href=\"/privacy/\">a link</a>, and <nobr>keep this on one line</nobr>. Anything else in angle brackets is shown as plain text rather than treated as formatting, so nothing you type here can break the page. Email addresses and https:// addresses turn into links on their own." }
                  - { name: items, label: "Bullet points  (list)", type: string, list: true, description: "One bullet per entry. Drag to reorder. Same variables and formatting as the text box above." }
                  - name: rows
                    label: "Table rows  (table)"
                    type: object
                    list: true
                    description: "Two columns. Drag to reorder."
                    fields:
                      - { name: label, label: "Left column (e.g. the company name)", type: string }
                      - { name: text, label: "Right column (what they do with your information)", type: text }
          - { name: browserTitle, label: "Browser tab title", type: string, description: "What shows in the browser tab and in a Google result. Variables work here too. Kept out of the way at the bottom because it rarely needs changing." }
          - { name: metaDescription, label: "Search-result description", type: text, description: "The grey line under the title in a search result. Aim for about 150 characters. Variables work here too." }
