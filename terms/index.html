<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2545">
<title>Terms of Use | Rare Pond Studios</title>
<meta name="description" content="The terms that govern your use of rarepond.com, including the rentals and media pages, and how the rental request flow works.">
<link rel="icon" type="image/png" sizes="32x32" href="/media/site/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/media/site/favicon-48.png">
<link rel="apple-touch-icon" href="/media/site/apple-touch-icon.png">
<script src="/assets/error-beacon.js"></script>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/chrome.css">
<link rel="stylesheet" href="/assets/legal.css">
</head>
<body>
<div class="lg-caustics" aria-hidden="true"></div>
<div class="lg-caustics-top" aria-hidden="true"></div>

<header class="lg-hdr"><div class="hdr-bg" aria-hidden="true"></div>
  <a class="lg-logo" href="/" aria-label="Rare Pond Studios home">
    <img src="/media/logos/duck-white.webp" alt="Rare Pond Studios">
    <span class="lg-brand"><span class="bn-rare">Rare Pond</span><span class="bn-sub">Studios</span></span>
  </a>
  <nav class="lg-nav" id="lgNav"></nav>
  <div class="lg-right"><div class="rp-soc" id="mSocials"></div></div>
</header>

<main class="lg-main" data-legal="terms">
  <h1>Terms of Use</h1>
  <p>Loading. If this page stays blank, JavaScript is switched off in your browser;
     get in touch and we will send you a copy.</p>
</main>

<div class="mfootwrap">
  <div class="deepwater" id="mWater"></div>
  <footer class="site-footer rp-footer" id="mFoot">
    <a class="fwm" href="/" aria-label="Rare Pond Studios home"><img src="/media/logos/duck-mark.webp" alt=""><span class="fwm-txt"><span class="fwm-rare">Rare Pond</span><span class="fwm-sub">Studios</span></span></a>
    <div class="tag" id="mFootTag">Let's Make Something Amazing...</div>
    <div class="fsoc" id="mFootSoc"></div>
    <div class="flinks" id="mFootLinks"></div>
    <div class="copy" id="mFootCopy"></div>
  </footer>
</div>

<script src="/assets/socials.js"></script>
<script src="/assets/legal-render.js"></script>
<script>
(function () {
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  Promise.all([
    fetch('/data/site.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
    fetch('/data/socials.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
  ]).then(function (res) {
    var site = res[0], soc = res[1];
    if (site && window.RP_renderChrome) window.RP_renderChrome(site, {}, (soc && soc.socials) || []);
    var nav = document.getElementById('lgNav');
    if (nav && site && site.nav) {
      nav.innerHTML = site.nav
        .filter(function (l) { return l && l.label && l.href !== '/terms/' && l.href !== '/privacy/'; })
        .map(function (l) { var href = l.href ? l.href : ('/#' + (l.go || '')); return '<a href="' + esc(href) + '">' + esc(l.label) + '</a>'; })
        .join('');
    }
  });
})();
</script>
</body>
</html>
